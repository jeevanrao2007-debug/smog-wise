name: SmogWise CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Rules Lint, Unit/API Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run strict TypeScript type check
        run: npm run lint

      - name: Run Firestore security rules linter
        run: npm run lint:rules

      - name: Run unit, impact-model, API integration, accessibility, and security tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  firestore-emulator-rules:
    name: Firestore Emulator Security Rules Suite
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 for Firebase Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Execute Firestore Emulator authorization & concurrency rules tests
        run: firebase emulators:exec --only firestore "npm run test:rules:emulator"

  e2e-and-accessibility:
    name: Playwright E2E & axe-core WCAG 2.2 AA Suite (Desktop + Mobile)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright CLI & Chromium
        run: |
          npm install -g @playwright/cli
          playwright-cli install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run automated Desktop + Mobile E2E, fallback, lazy-load & axe-core checks
        run: NODE_ENV=production npm run test:e2e
